[project]
name = "server"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.142.2",
    "uvicorn>=0.54.0",
    "python-dotenv>=1.2.4",
    "pydantic>=2.13.5",
    "spotifyscraper==3.9.2",
    "httpx>=0.28.1",
    "cryptography>=46.0.0",
    "docker>=7.1.0",
]

[tool.fastapi]
entrypoint = "server.main:app"
